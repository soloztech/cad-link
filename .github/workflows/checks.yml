name: Checks

on:
  push:
    branches: ["16.0"]
  pull_request:
    branches: ["16.0"]

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Python, XML and manifest validation
        run: python tools/check_repository.py
      - name: Portable path and document access tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: |
          node --input-type=module --check < cad_link/static/src/cad_documents.js
          node --input-type=module --check < cad_link/static/src/viewer.js
      - name: Bundled renderer integrity
        run: python tools/vendor_model_viewer.py

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Windows launcher request validation
        shell: powershell
        run: .\desktop\windows\tests\Test-RequestParser.ps1
      - name: Windows executable build and rejection smoke
        shell: powershell
        run: .\desktop\windows\tests\Test-LauncherBuild.ps1
      - name: Inventor export filesystem guards
        shell: powershell
        run: .\desktop\inventor\tests\Test-ExportFiles.ps1
      - name: Inventor local skill guards
        shell: powershell
        run: .\desktop\inventor\skill\cad-link-export-glb\scripts\Test-CadLinkGlbHelper.ps1
